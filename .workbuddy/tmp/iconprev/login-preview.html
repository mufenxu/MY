<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>登录页插图版面预览</title>
<style>
  :root { --bg:#F6F8FD; --surface:#FFFFFF; --ink:#172033; --muted:#667085; --line:#E6EBF3; --primary:#2563EB; }
  * { box-sizing: border-box; }
  body { margin:0; padding:40px 32px 56px; background:#F1F4F9; font-family:"Microsoft YaHei UI","PingFang SC",system-ui,sans-serif; color:var(--ink); }
  h1 { font-size:15px; font-weight:600; margin:0 0 4px; }
  .sub { font-size:12px; color:var(--muted); margin:0 0 28px; }
  .stage { display:flex; gap:56px; align-items:flex-start; }
  .caption { font-size:12px; color:var(--muted); text-align:center; margin-top:14px; }
  .frame { background:var(--bg); border-radius:26px; border:1px solid #DDE3EC; position:relative; overflow:hidden; box-shadow:0 1px 2px rgba(23,32,51,.05); }
  .phone { width:412px; height:915px; }
  .tablet { width:1000px; height:768px; border-radius:18px; }
  .deco { position:absolute; inset:0; pointer-events:none; }
  .deco i { position:absolute; display:block; }
  .d1 { left:0; top:-8%; width:120%; height:52%; background:linear-gradient(120deg,rgba(37,99,235,.055),rgba(37,99,235,0)); transform:rotate(-8deg); }
  .d2 { right:-6%; top:4%; width:300px; height:300px; border:1px solid rgba(37,99,235,.10); border-radius:64px; transform:rotate(-28deg); }
  .d3 { left:0; bottom:0; width:100%; height:26%; background:linear-gradient(0deg,rgba(37,99,235,.045),transparent); }

  .col { position:relative; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 24px; }
  .hero { width:140px; height:140px; border-radius:18px; display:block;
          box-shadow:0 10px 24px -8px rgba(35,48,74,.16); }
  .hero.big { width:300px; height:300px; border-radius:39px; box-shadow:0 10px 24px -8px rgba(35,48,74,.16); }
  .hdr { display:flex; flex-direction:column; align-items:center; margin-top:24px; }
  .logo { width:56px; height:56px; border-radius:16px; background:#E4EEFF; display:grid; place-items:center; font-size:20px; font-weight:700; color:var(--primary); }
  .t1 { font-size:27px; font-weight:600; margin:16px 0 0; letter-spacing:-.2px; }
  .t2 { font-size:12.5px; color:var(--muted); margin:8px 0 0; }
  .card { width:100%; max-width:440px; background:var(--surface); border:1px solid var(--line); border-radius:26px;
          box-shadow:0 14px 32px -12px rgba(35,48,74,.20), 0 3px 8px -3px rgba(35,48,74,.09); padding:24px; margin-top:28px; }
  .field-label { font-size:12px; color:var(--muted); margin:0 0 6px; }
  .field { height:52px; border-radius:26px; background:#F4F6FA; display:flex; align-items:center; padding:0 18px; font-size:13.5px; color:#9AA4B6; }
  .field + .field-label { margin-top:14px; }
  .btn { height:52px; border-radius:26px; background:var(--primary); color:#fff; display:grid; place-items:center; font-size:15px; font-weight:600; margin-top:20px; }
  .alt { margin-top:24px; padding-top:16px; border-top:1px solid var(--line); display:flex; justify-content:space-between; font-size:12px; color:var(--muted); }
  .foot { position:absolute; left:0; right:0; bottom:16px; text-align:center; font-size:11px; color:#9AA4B6; line-height:1.9; }
  .split { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:48px; padding:0 40px; }
  .left { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .right { flex:1; max-width:440px; }
  .right .card { margin-top:0; }
</style>
</head>
<body>
  <h1>登录页插图版面预览</h1>
  <p class="sub">按 1dp = 1px 等比还原：手机端插图 140dp，平板/横屏双栏插图 300dp。左边为手机竖屏，右边为展开宽度。</p>

  <div class="stage">
    <div>
      <div class="frame phone">
        <div class="deco"><i class="d1"></i><i class="d2"></i><i class="d3"></i></div>
        <div class="col">
          <img class="hero" src="login_hero.webp" alt="">
          <div class="hdr">
            <div class="logo">S</div>
            <p class="t1">登录智控中心</p>
            <p class="t2">你的应用与日常，一处掌握</p>
          </div>
          <div class="card">
            <p class="field-label">账号</p>
            <div class="field">请输入您的账号</div>
            <p class="field-label">密码</p>
            <div class="field">请输入您的密码</div>
            <div class="btn">登录</div>
            <div class="alt"><span>扫码登录</span><span>忘记密码</span></div>
          </div>
        </div>
        <div class="foot">© 2026 智控中心 · 安全传输已加密<br>系统版本 v1.0.0</div>
      </div>
      <p class="caption">手机竖屏（412 × 915）</p>
    </div>

    <div>
      <div class="frame tablet">
        <div class="deco"><i class="d1"></i><i class="d2"></i><i class="d3"></i></div>
        <div class="split">
          <div class="left">
            <img class="hero big" src="login_hero.webp" alt="">
            <div class="hdr">
              <div class="logo">S</div>
              <p class="t1">登录智控中心</p>
              <p class="t2">你的应用与日常，一处掌握</p>
            </div>
          </div>
          <div class="right">
            <div class="card">
              <p class="field-label">账号</p>
              <div class="field">请输入您的账号</div>
              <p class="field-label">密码</p>
              <div class="field">请输入您的密码</div>
              <div class="btn">登录</div>
              <div class="alt"><span>扫码登录</span><span>忘记密码</span></div>
            </div>
          </div>
        </div>
      </div>
      <p class="caption">展开宽度（1000 × 768）</p>
    </div>
  </div>
</body>
</html>
