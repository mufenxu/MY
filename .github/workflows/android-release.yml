name: Android Release

on:
  push:
    branches: [main]
    paths:
      - 'apps/android-app/**'
      - 'scripts/android-release.mjs'
      - 'scripts/android-release.test.mjs'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Verify release version logic
        run: node --test scripts/android-release.test.mjs

      - name: Resolve release version
        id: version
        env:
          BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}
        shell: bash
        run: |
          set -euo pipefail
          existing_tag=""
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            existing_tag="$(git tag --points-at "${GITHUB_SHA}" --list 'android-v*' | sort -V | tail -n 1)"
          fi
          if [[ -n "${existing_tag}" ]]; then
            version="${existing_tag#android-v}"
          else
            version="$(node scripts/android-release.mjs next --bump "${BUMP}" --base 1.1.0)"
          fi
          version_code="$(node scripts/android-release.mjs version-code --version "${version}")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${version_code}" >> "${GITHUB_OUTPUT}"
          echo "tag=android-v${version}" >> "${GITHUB_OUTPUT}"

      - name: Restore dedicated release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/my-control-release.jks
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64}" || -z "${RELEASE_KEY_ALIAS}" || -z "${RELEASE_STORE_PASSWORD}" || -z "${RELEASE_KEY_PASSWORD}" ]]; then
            echo "::error::Android release signing secrets are incomplete"
            exit 1
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RELEASE_KEYSTORE_PATH}"
          test -s "${RELEASE_KEYSTORE_PATH}"

      - name: Build signed release APK
        working-directory: apps/android-app
        env:
          ORG_GRADLE_PROJECT_androidReleaseStoreFile: ${{ runner.temp }}/my-control-release.jks
          ORG_GRADLE_PROJECT_androidReleaseKeyAlias: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_androidReleaseStorePassword: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_androidReleaseKeyPassword: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease \
            -PappVersionName=${{ steps.version.outputs.version }} \
            -PappVersionCode=${{ steps.version.outputs.version_code }} \
            --console=plain --no-daemon

      - name: Verify APK signature and prepare assets
        id: assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          source_apk="apps/android-app/app/build/outputs/apk/release/app-release.apk"
          apk_name="my-control-${VERSION}.apk"
          mkdir -p android-release-assets
          cp "${source_apk}" "android-release-assets/${apk_name}"
          build_tools="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "${build_tools}/apksigner" verify --verbose --print-certs "android-release-assets/${apk_name}"
          sha256="$(sha256sum "android-release-assets/${apk_name}" | cut -d ' ' -f 1)"
          apk_size="$(stat -c '%s' "android-release-assets/${apk_name}")"
          printf '%s  %s\n' "${sha256}" "${apk_name}" > "android-release-assets/${apk_name}.sha256"
          echo "apk_name=${apk_name}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"
          echo "apk_size=${apk_size}" >> "${GITHUB_OUTPUT}"

      - name: Generate release notes and update manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA256: ${{ steps.assets.outputs.sha256 }}
          APK_SIZE: ${{ steps.assets.outputs.apk_size }}
        shell: bash
        run: |
          set -euo pipefail
          previous_tag="$(git tag --list 'android-v*' --sort=-version:refname | grep -Fvx "${TAG}" | head -n 1 || true)"
          if [[ -n "${previous_tag}" ]]; then
            git log --format='- %s (%h)' "${previous_tag}..${GITHUB_SHA}" -- apps/android-app > android-release-notes.md
          else
            git log -n 20 --format='- %s (%h)' "${GITHUB_SHA}" -- apps/android-app > android-release-notes.md
          fi
          if [[ ! -s android-release-notes.md ]]; then
            printf '%s\n' '- Android application update' > android-release-notes.md
          fi
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          node scripts/android-release.mjs manifest \
            --repository "${GITHUB_REPOSITORY}" \
            --version "${VERSION}" \
            --sha256 "${SHA256}" \
            --apk-size "${APK_SIZE}" \
            --published-at "${published_at}" \
            --notes-file android-release-notes.md \
            --output android-release-assets/latest.json

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" android-release-assets/* --clobber
            gh release edit "${TAG}" --title "MY Control v${VERSION}" --notes-file android-release-notes.md --latest
          else
            gh release create "${TAG}" android-release-assets/* \
              --target "${GITHUB_SHA}" \
              --title "MY Control v${VERSION}" \
              --notes-file android-release-notes.md \
              --latest
          fi
