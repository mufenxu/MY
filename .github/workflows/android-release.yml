name: Android Release

on:
  push:
    branches: [main]
    paths:
      - 'apps/android-app/**'
      - 'scripts/android-release.mjs'
      - 'scripts/android-release.test.mjs'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Verify release version logic
        run: node --test scripts/android-release.test.mjs

      - name: Resolve release version
        id: version
        env:
          BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}
        shell: bash
        run: |
          set -euo pipefail
          existing_tag=""
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            existing_tag="$(git tag --points-at "${GITHUB_SHA}" --list 'android-v*' | sort -V | tail -n 1)"
          fi
          if [[ -n "${existing_tag}" ]]; then
            version="${existing_tag#android-v}"
          else
            version="$(node scripts/android-release.mjs next --bump "${BUMP}" --base 1.1.0)"
          fi
          version_code="$(node scripts/android-release.mjs version-code --version "${version}")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${version_code}" >> "${GITHUB_OUTPUT}"
          echo "tag=android-v${version}" >> "${GITHUB_OUTPUT}"

      - name: Verify Android quality for the release commit
        working-directory: apps/android-app
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:lintRelease --console=plain --no-daemon

      - name: Restore dedicated release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/my-control-release.jks
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64}" || -z "${RELEASE_KEY_ALIAS}" || -z "${RELEASE_STORE_PASSWORD}" || -z "${RELEASE_KEY_PASSWORD}" ]]; then
            echo "::error::Android release signing secrets are incomplete"
            exit 1
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RELEASE_KEYSTORE_PATH}"
          test -s "${RELEASE_KEYSTORE_PATH}"

      - name: Build signed release APK
        working-directory: apps/android-app
        env:
          ORG_GRADLE_PROJECT_androidReleaseStoreFile: ${{ runner.temp }}/my-control-release.jks
          ORG_GRADLE_PROJECT_androidReleaseKeyAlias: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_androidReleaseStorePassword: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_androidReleaseKeyPassword: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          for attempt in 1 2 3; do
            if ./gradlew :app:assembleRelease \
              -PappVersionName=${{ steps.version.outputs.version }} \
              -PappVersionCode=${{ steps.version.outputs.version_code }} \
              --console=plain --no-daemon; then
              exit 0
            fi
            echo "::warning::Gradle build attempt ${attempt} failed, retrying in 30s"
            if [[ "${attempt}" != "3" ]]; then
              sleep 30
            fi
          done
          exit 1

      - name: Verify APK signature and prepare assets
        id: assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          source_apk="apps/android-app/app/build/outputs/apk/release/app-release.apk"
          apk_name="my-control-${VERSION}.apk"
          mkdir -p android-release-assets
          cp "${source_apk}" "android-release-assets/${apk_name}"
          build_tools="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "${build_tools}/apksigner" verify --verbose --print-certs "android-release-assets/${apk_name}"
          sha256="$(sha256sum "android-release-assets/${apk_name}" | cut -d ' ' -f 1)"
          apk_size="$(stat -c '%s' "android-release-assets/${apk_name}")"
          printf '%s  %s\n' "${sha256}" "${apk_name}" > "android-release-assets/${apk_name}.sha256"
          echo "apk_name=${apk_name}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"
          echo "apk_size=${apk_size}" >> "${GITHUB_OUTPUT}"

      - name: Generate release notes and update manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA256: ${{ steps.assets.outputs.sha256 }}
          APK_SIZE: ${{ steps.assets.outputs.apk_size }}
          DOWNLOAD_BASE_URL: https://7n.pxyb.cn
        shell: bash
        run: |
          set -euo pipefail
          previous_tag="$(git tag --list 'android-v*' --sort=-version:refname | grep -Fvx "${TAG}" | head -n 1 || true)"
          if [[ -n "${previous_tag}" ]]; then
            git log --format='- %s (%h)' "${previous_tag}..${GITHUB_SHA}" -- apps/android-app > android-release-notes.md
          else
            git log -n 20 --format='- %s (%h)' "${GITHUB_SHA}" -- apps/android-app > android-release-notes.md
          fi
          if [[ ! -s android-release-notes.md ]]; then
            printf '%s\n' '- Android application update' > android-release-notes.md
          fi
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          node scripts/android-release.mjs manifest \
            --repository "${GITHUB_REPOSITORY}" \
            --version "${VERSION}" \
            --sha256 "${SHA256}" \
            --apk-size "${APK_SIZE}" \
            --published-at "${published_at}" \
            --notes-file android-release-notes.md \
            --download-base-url "${DOWNLOAD_BASE_URL}" \
            --output android-release-assets/latest.json

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" android-release-assets/* --clobber
            gh release edit "${TAG}" --title "MY Control v${VERSION}" --notes-file android-release-notes.md --latest
          else
            gh release create "${TAG}" android-release-assets/* \
              --target "${GITHUB_SHA}" \
              --title "MY Control v${VERSION}" \
              --notes-file android-release-notes.md \
              --latest
          fi

      - name: Publish update assets to Qiniu
        env:
          GH_TOKEN: ${{ github.token }}
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
          APK_NAME: ${{ steps.assets.outputs.apk_name }}
          DOWNLOAD_BASE_URL: https://7n.pxyb.cn
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${QINIU_ACCESS_KEY}" || -z "${QINIU_SECRET_KEY}" || -z "${QINIU_BUCKET}" ]]; then
            echo "::error::Qiniu upload secrets are incomplete. Configure QINIU_ACCESS_KEY, QINIU_SECRET_KEY and QINIU_BUCKET."
            exit 1
          fi

          qshell_version="v2.19.12"
          qshell_dir="${RUNNER_TEMP}/qshell"
          mkdir -p "${qshell_dir}"
          gh release download "${qshell_version}" \
            --repo qiniu/qshell \
            --pattern "qshell-${qshell_version}-linux-amd64.tar.gz" \
            --dir "${qshell_dir}" \
            --clobber
          tar -xzf "${qshell_dir}/qshell-${qshell_version}-linux-amd64.tar.gz" -C "${qshell_dir}"
          qshell_bin="${qshell_dir}/qshell"
          chmod +x "${qshell_bin}"
          "${qshell_bin}" -v

          qshell_workspace="${RUNNER_TEMP}/qshell-workspace"
          mkdir -p "${qshell_workspace}"
          trap 'rm -rf "${qshell_workspace}" "${qshell_dir}"' EXIT
          pushd "${qshell_workspace}" >/dev/null
          "${qshell_bin}" -L account "${QINIU_ACCESS_KEY}" "${QINIU_SECRET_KEY}" android-release
          "${qshell_bin}" -L fput "${QINIU_BUCKET}" "android/${APK_NAME}" \
            "${GITHUB_WORKSPACE}/android-release-assets/${APK_NAME}" \
            --overwrite --mimetype application/vnd.android.package-archive
          "${qshell_bin}" -L fput "${QINIU_BUCKET}" android/latest.json \
            "${GITHUB_WORKSPACE}/android-release-assets/latest.json" \
            --overwrite --mimetype application/json
          "${qshell_bin}" -L fput "${QINIU_BUCKET}" "android/${APK_NAME}.sha256" \
            "${GITHUB_WORKSPACE}/android-release-assets/${APK_NAME}.sha256" \
            --overwrite --mimetype text/plain

          refresh_file="${RUNNER_TEMP}/qiniu-cdn-refresh.txt"
          printf '%s\n' \
            "${DOWNLOAD_BASE_URL}/android/latest.json" \
            "${DOWNLOAD_BASE_URL}/android/${APK_NAME}" \
            "${DOWNLOAD_BASE_URL}/android/${APK_NAME}.sha256" > "${refresh_file}"
          "${qshell_bin}" -L cdnrefresh -i "${refresh_file}"

          manifest_probe="${RUNNER_TEMP}/qiniu-latest.json"
          manifest_expected_url="${DOWNLOAD_BASE_URL}/android/${APK_NAME}"
          manifest_probe_base_url="${DOWNLOAD_BASE_URL}/android/latest.json"
          manifest_ready=false
          for attempt in {1..12}; do
            observed_apk_url="<unreachable>"
            manifest_probe_url="${manifest_probe_base_url}?release=${APK_NAME}&attempt=${attempt}"
            if curl -fsSL --connect-timeout 10 --max-time 30 \
              --header 'Cache-Control: no-cache' \
              "${manifest_probe_url}" -o "${manifest_probe}"; then
              if observed_apk_url="$(node -e '
                const fs = require("node:fs");
                const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                process.stdout.write(typeof manifest.apkUrl === "string" ? manifest.apkUrl : "");
              ' "${manifest_probe}" 2>/dev/null)"; then
                if [[ "${observed_apk_url}" == "${manifest_expected_url}" ]]; then
                  manifest_ready=true
                  break
                fi
              else
                observed_apk_url="<invalid JSON>"
              fi
            fi
            echo "::notice::Waiting for Qiniu latest.json to reference ${manifest_expected_url} (observed: ${observed_apk_url}, attempt ${attempt}/12)"
            if [[ "${attempt}" != "12" ]]; then
              sleep 5
            fi
          done
          if [[ "${manifest_ready}" != true ]]; then
            echo "::error::Qiniu latest.json did not reference the uploaded APK after CDN propagation wait"
            exit 1
          fi
          popd >/dev/null
