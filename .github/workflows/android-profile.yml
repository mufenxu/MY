name: Android Baseline Profile

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm

      - name: Generate profiles on an isolated offline fixture
        working-directory: apps/android-app
        run: |
          chmod +x ./gradlew
          ./gradlew :app:generateBaselineProfile \
            -PuseManagedProfileDevice=true \
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile \
            --console=plain --no-daemon --no-configuration-cache
          test -s app/src/main/generated/baselineProfiles/baseline-prof.txt
          test -s app/src/main/generated/baselineProfiles/startup-prof.txt

      - name: Upload generated profiles and reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-profile-${{ github.sha }}
          path: |
            apps/android-app/app/src/main/generated/baselineProfiles/
            apps/android-app/baselineprofile/build/outputs/managed_device_android_test_additional_output/
            apps/android-app/baselineprofile/build/reports/androidTests/
