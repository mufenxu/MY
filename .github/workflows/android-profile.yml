name: Android Performance

on:
  push:
    branches: [main]
    paths:
      - 'apps/android-app/app/src/**'
      - 'apps/android-app/core/**'
      - 'apps/android-app/baselineprofile/**'
      - 'apps/android-app/**.kts'
      - 'apps/android-app/gradle/**'
      - 'scripts/check-android-performance.mjs'
      - '.github/workflows/android-profile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/android-app/app/src/**'
      - 'apps/android-app/core/**'
      - 'apps/android-app/baselineprofile/**'
      - 'apps/android-app/**.kts'
      - 'apps/android-app/gradle/**'
      - 'scripts/check-android-performance.mjs'
      - '.github/workflows/android-profile.yml'
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Git ref used for the performance baseline
        required: true
        default: 'main~1'
        type: string

permissions:
  contents: read

concurrency:
  group: android-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_SERIAL: emulator-5554
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve baseline commit
        id: baseline
        env:
          BASE_REF: ${{ inputs.baseline_ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          reference="${BASE_REF:-${PR_BASE:-${PUSH_BASE:-HEAD^}}}"
          if [[ "$reference" =~ ^0+$ ]]; then reference='HEAD^'; fi
          baseline_sha="$(git rev-parse --verify --end-of-options "${reference}^{commit}")"
          echo "sha=$baseline_sha" >> "$GITHUB_OUTPUT"
          echo "Baseline: $baseline_sha; candidate: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout baseline
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ steps.baseline.outputs.sha }}
          path: .android-performance-baseline
          persist-credentials: false

      - name: Use the same offline fixture and test journey for both revisions
        run: |
          set -euo pipefail
          fixture='apps/android-app/app/src/benchmark/java/cn/pxyb/mycontrol/benchmark/BenchmarkFixtureActivity.kt'
          cp "$fixture" ".android-performance-baseline/$fixture"
          journey='apps/android-app/baselineprofile/src/main/kotlin/cn/pxyb/mycontrol/baselineprofile/BaselineProfileGenerator.kt'
          cp "$journey" ".android-performance-baseline/$journey"

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Start a dedicated emulator without snapshots
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/android-performance-avd
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sudo chmod a+rw /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-35;default;x86_64'
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name android-performance \
            --package 'system-images;android-35;default;x86_64' --device pixel_2
          mkdir -p android-performance-diagnostics
          "$ANDROID_HOME/emulator/emulator" -avd android-performance \
            -port 5554 -no-window -no-snapshot -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -feature -Vulkan \
            > android-performance-diagnostics/emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          for attempt in $(seq 1 90); do
            if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == '1' ]]; then
              adb shell input keyevent 82
              exit 0
            fi
            sleep 2
          done
          echo 'Emulator did not finish booting.' >&2
          exit 1

      - name: Measure baseline on the offline fixture
        working-directory: .android-performance-baseline/apps/android-app
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:generateBaselineProfile \
            -PuseManagedProfileDevice=false \
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile \
            --console=plain --info --stacktrace --no-daemon --no-configuration-cache
          ./gradlew :baselineprofile:connectedBenchmarkReleaseAndroidTest \
            -PuseManagedProfileDevice=false \
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=Macrobenchmark \
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR \
            --console=plain --info --stacktrace --no-daemon --no-configuration-cache

      - name: Generate profiles on an isolated offline fixture
        working-directory: apps/android-app
        run: |
          chmod +x ./gradlew
          ./gradlew :app:generateBaselineProfile \
            -PuseManagedProfileDevice=false \
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile \
            --console=plain --info --stacktrace --no-daemon --no-configuration-cache
          test -s app/src/main/generated/baselineProfiles/baseline-prof.txt
          test -s app/src/main/generated/baselineProfiles/startup-prof.txt

      - name: Measure candidate on the same device configuration
        working-directory: apps/android-app
        run: |
          ./gradlew :baselineprofile:connectedBenchmarkReleaseAndroidTest \
            -PuseManagedProfileDevice=false \
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=Macrobenchmark \
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR \
            --console=plain --info --stacktrace --no-daemon --no-configuration-cache

      - name: Check startup and interaction regressions
        run: |
          node scripts/check-android-performance.mjs \
            .android-performance-baseline/apps/android-app/baselineprofile/build/outputs/connected_android_test_additional_output \
            apps/android-app/baselineprofile/build/outputs/connected_android_test_additional_output

      - name: Stop the dedicated emulator
        if: always()
        run: |
          if adb get-state >/dev/null 2>&1; then adb emu kill; fi

      - name: Capture runner diagnostics on failure
        if: failure()
        run: |
          mkdir -p android-performance-diagnostics
          free -h > android-performance-diagnostics/memory.txt
          df -h > android-performance-diagnostics/disk.txt
          sudo dmesg -T > android-performance-diagnostics/kernel.log

      - name: Upload generated profiles and reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-profile-${{ github.sha }}
          include-hidden-files: true
          path: |
            android-performance-diagnostics/
            /tmp/android-runner/emu-crash-*/
            apps/android-app/app/src/main/generated/baselineProfiles/
            apps/android-app/baselineprofile/build/outputs/connected_android_test_additional_output/
            apps/android-app/baselineprofile/build/reports/androidTests/
            apps/android-app/baselineprofile/build/outputs/androidTest-results/
            .android-performance-baseline/apps/android-app/baselineprofile/build/outputs/connected_android_test_additional_output/
            .android-performance-baseline/apps/android-app/baselineprofile/build/reports/androidTests/
            .android-performance-baseline/apps/android-app/baselineprofile/build/outputs/androidTest-results/
