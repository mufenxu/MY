name: Android CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/android-app/**'
      - 'scripts/android-release.mjs'
      - 'scripts/android-release.test.mjs'
      - 'scripts/check-android-design.mjs'
      - 'scripts/check-android-design.test.mjs'
      - '.github/workflows/android-ci.yml'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android app checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Ensure Gradle wrapper is executable
        working-directory: apps/android-app
        run: chmod +x ./gradlew

      - name: Check Android design conventions
        run: npm run check:android-design

      - name: Run Android checks
        working-directory: apps/android-app
        run: ./gradlew :app:testDebugUnitTest :app:compileDebugKotlin :app:lintDebug :app:assembleDebug --console=plain --no-daemon
