name: Android CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/android-app/**'
      - 'scripts/android-release.mjs'
      - 'scripts/android-release.test.mjs'
      - '.github/workflows/android-ci.yml'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android app checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Ensure Gradle wrapper is executable
        working-directory: apps/android-app
        run: chmod +x ./gradlew

      - name: Run Android checks
        working-directory: apps/android-app
        run: ./gradlew :app:testDebugUnitTest :app:compileDebugKotlin :app:lintDebug :app:assembleDebug --console=plain --no-daemon
