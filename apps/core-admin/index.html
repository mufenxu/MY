<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="description" content="星轨控制台" />
    <title>星轨控制台</title>
    <!-- 防止首屏主题闪烁，同时保持严格的脚本 CSP。 -->
    <script src="/theme-bootstrap.js"></script>
  </head>
  <body>
    <div id="root">
      <div class="app-preloader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b0f19;color:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;z-index:99999;">
        <style>
          @keyframes orbitSpin { to { transform: rotate(360deg); } }
          @keyframes corePulse { 0%,100% { transform: scale(0.95); opacity: 0.6; } 50% { transform: scale(1.06); opacity: 1; } }
          .core-preloader-glow { width: 76px; height: 76px; position: relative; display: flex; align-items: center; justify-content: center; }
          .core-preloader-ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; border-top-color: #818cf8; border-right-color: #c084fc; animation: orbitSpin 1.2s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite; }
          .core-preloader-ring-inner { position: absolute; inset: 7px; border-radius: 50%; border: 2px solid transparent; border-bottom-color: #38bdf8; animation: orbitSpin 1.9s linear infinite reverse; }
          .core-preloader-core { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg, #4338ca, #7c3aed); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 24px rgba(129, 140, 248, 0.45); animation: corePulse 2s ease-in-out infinite; }
        </style>
        <div class="core-preloader-glow">
          <div class="core-preloader-ring"></div>
          <div class="core-preloader-ring-inner"></div>
          <div class="core-preloader-core">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"></circle>
              <line x1="12" y1="3" x2="12" y2="7"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
          </div>
        </div>
        <div style="margin-top:22px;font-size:15px;font-weight:600;letter-spacing:0.3px;color:#f1f5f9;">星轨控制台</div>
        <div style="margin-top:6px;font-size:12.5px;color:#94a3b8;letter-spacing:0.2px;">正在建立安全会话并进入系统...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
