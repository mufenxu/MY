<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="description" content="星轨控制台" />
    <title>星轨控制台</title>
    <!-- 防止首屏主题闪烁，同时保持严格的脚本 CSP。 -->
    <script src="/theme-bootstrap.js"></script>
  </head>
  <body>
    <div id="root">
      <!-- 首屏：背景透明，沿用 theme-bootstrap 写好的珍珠底色，避免深浅主题下的闪白 -->
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;z-index:99999;">
        <style>
          @keyframes pearl-orbit { to { transform: rotate(360deg); } }
          @keyframes pearl-breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
          .pearl-preloader-mark {
            position: relative;
            display: flex;
            width: 54px;
            height: 54px;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(46, 58, 62, 0.11);
            border-radius: 16px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.97), rgba(249, 252, 251, 0.93));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.92), 0 1px 2px rgba(46, 58, 62, 0.05), 0 5px 14px rgba(46, 58, 62, 0.04);
          }
          .pearl-preloader-ring {
            position: absolute;
            inset: -7px;
            border: 2px solid transparent;
            border-top-color: #236de9;
            border-right-color: rgba(35, 109, 233, 0.32);
            border-radius: 50%;
            animation: pearl-orbit 1.1s linear infinite;
          }
          .pearl-preloader-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #82dd2d;
            box-shadow: 0 0 0 5px rgba(130, 221, 45, 0.16);
            animation: pearl-breathe 1.8s ease-in-out infinite;
          }
        </style>
        <div class="pearl-preloader-mark">
          <div class="pearl-preloader-ring"></div>
          <div class="pearl-preloader-dot"></div>
        </div>
        <div style="margin-top:24px;font-size:14px;font-weight:600;letter-spacing:0.01em;color:#8d979a;">页面加载中…</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
