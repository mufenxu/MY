<!doctype html>
<html lang="zh-CN" data-theme-legacy-key="my-console-theme">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#171a1f" />
    <meta name="description" content="统一服务控制台" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>统一服务控制台</title>
    <script src="/theme-bootstrap.js"></script>
  </head>
  <body>
    <div id="root">
      <!-- 首屏占位与 React 的 LoadingScreen 同构，样式全部来自外链样式表：
           控制台 CSP 为 style-src 'self'，内联样式块与 style 属性都会被拦截。 -->
      <main class="loading-screen">
        <span class="brand-mark" aria-hidden="true">
          <img src="/favicon.svg" alt="" width="42" height="42" />
        </span>
        <div>
          <strong>统一服务控制台</strong>
          <span>
            <svg class="spin" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
            </svg>
            正在连接服务
          </span>
        </div>
      </main>
    </div>
    <script type="module" src="/src/client/main.jsx"></script>
  </body>
</html>
