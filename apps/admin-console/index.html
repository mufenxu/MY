<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#171a1f" />
    <meta name="description" content="统一服务控制台" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <title>统一服务控制台</title>
  </head>
  <body>
    <div id="root">
      <div class="app-preloader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f1217;color:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;z-index:99999;">
        <style>
          @keyframes appSpin { to { transform: rotate(360deg); } }
          @keyframes appPulse { 0%,100% { transform: scale(0.96); opacity: 0.55; } 50% { transform: scale(1.06); opacity: 0.95; } }
          .app-preloader-glow { width: 76px; height: 76px; position: relative; display: flex; align-items: center; justify-content: center; }
          .app-preloader-ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; border-top-color: #38bdf8; border-right-color: #3b82f6; animation: appSpin 1.1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite; }
          .app-preloader-ring-inner { position: absolute; inset: 7px; border-radius: 50%; border: 2px solid transparent; border-bottom-color: #818cf8; animation: appSpin 1.8s linear infinite reverse; }
          .app-preloader-core { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg, #1e3a8a, #0284c7); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 24px rgba(56, 189, 248, 0.4); animation: appPulse 2s ease-in-out infinite; }
        </style>
        <div class="app-preloader-glow">
          <div class="app-preloader-ring"></div>
          <div class="app-preloader-ring-inner"></div>
          <div class="app-preloader-core">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
          </div>
        </div>
        <div style="margin-top:22px;font-size:15px;font-weight:600;letter-spacing:0.3px;color:#f1f5f9;">统一服务控制台</div>
        <div style="margin-top:6px;font-size:12.5px;color:#94a3b8;letter-spacing:0.2px;">正在建立安全会话并进入系统...</div>
      </div>
    </div>
    <script type="module" src="/src/client/main.jsx"></script>
  </body>
</html>
