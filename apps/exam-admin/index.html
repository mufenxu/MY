<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>好爱学习</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" type="image/png" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.ico">
</head>

<body>
    <div id="app">
        <div class="app-preloader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#061a14;color:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;z-index:99999;">
            <style>
                @keyframes examSpin { to { transform: rotate(360deg); } }
                @keyframes examPulse { 0%,100% { transform: scale(0.95); opacity: 0.6; } 50% { transform: scale(1.06); opacity: 1; } }
                .exam-preloader-glow { width: 76px; height: 76px; position: relative; display: flex; align-items: center; justify-content: center; }
                .exam-preloader-ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; border-top-color: #34d399; border-right-color: #10b981; animation: examSpin 1.1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite; }
                .exam-preloader-ring-inner { position: absolute; inset: 7px; border-radius: 50%; border: 2px solid transparent; border-bottom-color: #6ee7b7; animation: examSpin 1.8s linear infinite reverse; }
                .exam-preloader-core { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg, #047857, #059669); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 24px rgba(52, 211, 153, 0.4); animation: examPulse 2s ease-in-out infinite; }
            </style>
            <div class="exam-preloader-glow">
                <div class="exam-preloader-ring"></div>
                <div class="exam-preloader-ring-inner"></div>
                <div class="exam-preloader-core">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                </div>
            </div>
            <div style="margin-top:22px;font-size:15px;font-weight:600;letter-spacing:0.3px;color:#f1f5f9;">好爱学习</div>
            <div style="margin-top:6px;font-size:12.5px;color:#94a3b8;letter-spacing:0.2px;">正在建立安全会话并进入系统...</div>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
